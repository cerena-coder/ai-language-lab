<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 语言实验室</title>
<meta name="description" content="六步学习法：盲听 → 听写 → 核对 → 查解 → 跟读 → 背诵。把一段真实材料，从听懂练到说出来。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%231da276'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23eafff3' stroke-width='3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark"><span class="brand-dot"></span></div>
      <div class="brand-text">
        <strong>AI 语言实验室</strong>
        <small>AI LANGUAGE LAB · 六步学习法</small>
      </div>
    </div>

    <div class="nav-group">
      <div class="nav-label">学习 · LEARN</div>
      <button class="nav-item active" data-view="home"><span class="ni-icon" data-icon="home"></span>学习课程</button>
      <button class="nav-item" data-view="courses"><span class="ni-icon" data-icon="book"></span>官方课程</button>
      <button class="nav-item" data-view="diy"><span class="ni-icon" data-icon="sparkle"></span>我的素材库</button>
      <button class="nav-item" data-view="vocab"><span class="ni-icon" data-icon="layers"></span>词库<span class="nav-badge" id="vocabBadge">0</span></button>
      <button class="nav-item" data-view="shadow"><span class="ni-icon" data-icon="mic"></span>跟读训练</button>
      <button class="nav-item" data-view="recite"><span class="ni-icon" data-icon="quote"></span>背诵训练</button>
    </div>

    <div class="nav-group">
      <div class="nav-label">练习 · PLAY</div>
      <button class="nav-item" data-view="classroom"><span class="ni-icon" data-icon="board"></span>教室课堂</button>
      <button class="nav-item" data-view="gate"><span class="ni-icon" data-icon="flag"></span>单词闯关</button>
      <button class="nav-item" data-view="tank"><span class="ni-icon" data-icon="gamepad"></span>坦克大战</button>
      <button class="nav-item" data-view="review"><span class="ni-icon" data-icon="refresh"></span>智能复习<span class="nav-badge hidden" id="reviewBadge">0</span></button>
    </div>

    <div class="nav-group">
      <div class="nav-label">内容 · LIBRARY</div>
      <button class="nav-item" data-view="daily"><span class="ni-icon" data-icon="calendar"></span>每日更新</button>
      <button class="nav-item" data-view="method"><span class="ni-icon" data-icon="compass"></span>六步学习法</button>
    </div>

    <div class="side-card">
      <div class="side-card-art">
        <svg viewBox="0 0 120 54" width="104" height="46" aria-hidden="true">
          <path d="M8 40 Q30 14 52 40 T96 40" fill="none" stroke="#2f9e78" stroke-width="2" stroke-linecap="round"/>
          <circle cx="52" cy="40" r="4" fill="#2f9e78"/>
          <path d="M96 40 l7 -4 v8 z" fill="#2f9e78"/>
          <circle cx="102" cy="12" r="2.2" fill="#e0a83c"/>
          <path d="M22 14 l1.6 3.4 3.4 1.6 -3.4 1.6 -1.6 3.4 -1.6 -3.4 -3.4 -1.6 3.4 -1.6z" fill="#e0a83c"/>
        </svg>
      </div>
      <strong>每天 20 分钟，<br>把一段练透。</strong>
      <p>一段材料，六步走完，才算学完。</p>
      <div class="side-card-foot">AI 语言实验室 · 2026</div>
    </div>

    <div class="side-foot">
      <button class="link-btn" id="resetBtn">重置演示数据</button>
      <span>演示版 v1.0</span>
    </div>
  </aside>

  <div class="main-wrap">
    <header class="topbar">
      <div class="crumb" id="crumb">学习课程</div>
      <div class="top-actions">
        <button class="top-import" data-act="gotoImport" title="导入视频 / 音频 / 文章"><span data-icon="plus"></span> 导入</button>
        <span class="demo-flag" title="本产品为演示原型，课文与音频为内置示例">演示原型</span>
        <button class="track-pill" id="trackPill" title="学习轨道设置：两套六步并存、进度独立"><span data-icon="settings"></span> <b>精练六步</b></button>
        <button class="mode-pill" id="modePill" title="切换六步引导模式"><span class="mode-dot"></span>六步模式 <b>开</b></button>
        <span class="points" title="学习积分"><span data-icon="star"></span><b id="pointsVal">0</b> 积分</span>
        <button class="icon-btn" id="searchBtn" title="搜索课程"><span data-icon="search"></span></button>
        <span class="avatar" title="演示账号">语</span>
      </div>
    </header>

    <main class="view" id="view"></main>
  </div>
</div>

<div class="word-pop hidden" id="wordPop"></div>
<div class="toast" id="toast"></div>
<div class="modal-mask hidden" id="modalMask"><div class="modal" id="modal"></div></div>

<script src="data.js"></script>
<script src="vendor/mp4box.all.min.js"></script>
<script src="library.js"></script>
<script src="modules.js"></script>
<script src="app.js"></script>
</body>
</html>
