name = "ailab-tts"
main = "worker.js"
compatibility_date = "2024-09-23"
account_id = "128deaa811c11762b17dd6c98b3d0185"

[[kv_namespaces]]
binding = "SYNC_KV"
id = "85926138679c452d80910cfdfa7b45d8"

# 说明：
# 1. 安装 wrangler：npm install -g wrangler
# 2. 登录：       wrangler login
# 3. 部署：       wrangler deploy
# 部署成功后终端会输出 https://ailab-tts.<你的子域>.workers.dev
# 把该地址填进网站的「🎙 声音 → 微软Edge在线(免费) → Edge TTS 地址」即可。
# 全程免费、无需 API key、不绑卡。
#
# ---- 学习档案云同步（可选，需要 KV）----
# 首次启用同步接口前，先执行一次：
#   wrangler kv namespace create SYNC_KV
# 把输出里的 id 填进下面，并去掉这三行行首的 # 号：
# [[kv_namespaces]]
# binding = "SYNC_KV"
# id = "填 namespace id"
# 未绑定 KV 时 /api/sync 会返回明确的 503，前端提示「云端暂不可用」，不会假装同步成功。
